[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tabsets"
version = "0.1.0"
description = "Set-valued reliability for tabular classifiers, from cached probabilities"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "José Lucas De Melo Costa" },
    { name = "Fabrice Popineau" },
    { name = "Arpad Rimmel" },
    { name = "Bich-Liên Doan" },
]
keywords = [
    "conformal prediction",
    "prediction sets",
    "tabular foundation models",
    "uncertainty quantification",
    "calibration",
    "benchmark",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyarrow>=14",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7", "mapie>=1.0"]
plot = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/jose-melo/tabsets"

[project.scripts]
tabsets = "tabsets.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tabsets = ["data/*.csv", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
